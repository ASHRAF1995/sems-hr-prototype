<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEMS HR — Web UI Prototype</title>
<style>
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#f8fafc; --line:#e4e8f0; --line-2:#d5dce8;
  --text:#1a2233; --text-2:#5b6779; --text-3:#8a94a6;
  --brand:#1f7a5a; --brand-2:#2a9d78; --brand-soft:#e8f5f0;
  --accent:#2f5fd0; --accent-soft:#eaf0fd;
  --warn:#c2410c; --warn-soft:#fff2e8;
  --danger:#c0392b; --danger-soft:#fdeceb;
  --ok:#1f7a5a; --ok-soft:#e8f5f0;
  --radius:10px; --radius-sm:7px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05);
  --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
button{font:inherit}
input,select,textarea{font:inherit;color:var(--text)}

/* ---------- top bar ---------- */
.topbar{background:linear-gradient(180deg,#1f7a5a,#186349);color:#fff;position:sticky;top:0;z-index:40}
.topbar-inner{max-width:1560px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:22px;height:56px}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;letter-spacing:.5px;font-size:19px}
.brand small{font-weight:400;font-size:10.5px;opacity:.75;letter-spacing:.3px}
.topnav{display:flex;gap:2px;margin-left:14px}
.topnav button{background:none;border:0;color:#d9ece4;padding:8px 14px;border-radius:7px;cursor:pointer;font-size:13.5px;font-weight:500}
.topnav button:hover{background:rgba(255,255,255,.12);color:#fff}
.topnav button.on{background:rgba(255,255,255,.18);color:#fff}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:12.5px;color:#cfe6dc}
.topbar-right .clock{font-variant-numeric:tabular-nums;opacity:.85}
.topbar-right a{color:#eaf6f1}
.announce{background:#155041;color:#d5ece2;font-size:12.5px;text-align:center;padding:6px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.announce span{direction:rtl;unicode-bidi:isolate}

/* ---------- layout ---------- */
.shell{max-width:1560px;margin:0 auto;padding:18px 20px 60px;display:grid;grid-template-columns:236px 1fr;gap:18px;align-items:start}
.side{position:sticky;top:74px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-h{padding:10px 14px;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--line);background:var(--surface-2)}
.panel-b{padding:12px 14px}
.side-link{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--text-2);font-size:13.5px;border-left:3px solid transparent}
.side-link:hover{background:var(--surface-2);color:var(--text)}
.side-link.on{background:var(--brand-soft);color:var(--brand);border-left-color:var(--brand);font-weight:600}
.side-link .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;flex:none}
.wp-label{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;font-weight:600}

/* ---------- page ---------- */
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.page-title{font-size:21px;font-weight:650;margin:0;letter-spacing:-.2px}
.page-sub{color:var(--text-2);font-size:13px;margin:3px 0 0}
.code-badge{font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent);border:1px solid #cfdcfa;padding:3px 8px;border-radius:6px;font-weight:600;white-space:nowrap}
.page-head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.card-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:var(--radius) var(--radius) 0 0}
.card-h h3{margin:0;font-size:13.5px;font-weight:650;letter-spacing:.1px}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:16px}
.card-b.tight{padding:0}
.section-label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3);margin:22px 0 10px}
.section-label:first-child{margin-top:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:#fff;color:var(--text);padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:550;transition:.12s}
.btn:hover{background:var(--surface-2);border-color:#c3ccdb}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:#186349;border-color:#186349}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-accent:hover{background:#2650b4;border-color:#2650b4}
.btn-warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn-warn:hover{background:#a33509}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-ghost{background:none;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:13px;font-weight:550}
.linkbtn:hover{text-decoration:underline}

/* ---------- forms ---------- */
.grid-form{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 18px}
.grid-form.c3{grid-template-columns:repeat(3,1fr)}
.grid-form.c2{grid-template-columns:repeat(2,1fr)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:12px;color:var(--text-2);font-weight:600;display:flex;align-items:center;gap:5px}
.f .req{color:var(--danger);font-weight:700}
.f input[type=text],.f input[type=number],.f input[type=date],.f select,.f textarea{
  border:1px solid var(--line-2);background:#fff;border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;width:100%;outline:none;transition:.12s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f input:disabled,.f select:disabled,.f input[readonly]{background:#f1f3f7;color:var(--text-2);cursor:not-allowed}
.f .hint{font-size:11px;color:var(--text-3)}
.f.rtl input{direction:rtl;text-align:right}
.radio-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-top:2px}
.radio-row label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text);cursor:pointer;font-weight:450}
.derived{background:var(--accent-soft);border:1px dashed #bcd0f7;color:#20458f;font-size:10.5px;padding:1px 6px;border-radius:5px;font-weight:650}
.ro-tag{background:#eef1f6;color:var(--text-3);font-size:10.5px;padding:1px 6px;border-radius:5px;font-weight:650}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;font-size:13px}
table.grid th{background:var(--surface-2);text-align:left;padding:10px 12px;font-size:11.5px;font-weight:700;color:var(--text-2);letter-spacing:.3px;border-bottom:1px solid var(--line);white-space:nowrap;position:relative}
table.grid th.sorted::after{content:'▲';font-size:8px;margin-left:6px;color:var(--accent)}
table.grid td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.grid tbody tr:hover{background:#fafcff}
table.grid tr.filters td{padding:6px 8px;background:#fcfdff}
table.grid tr.filters input,table.grid tr.filters select{width:100%;border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-size:12px;background:#fff}
table.grid tfoot td{background:var(--surface-2);font-weight:700;border-top:2px solid var(--line-2)}
.empty{padding:34px;text-align:center;color:var(--text-3);font-size:13px}
.avatar{width:34px;height:34px;border-radius:7px;background:#e8ecf3;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:10px;font-weight:700;overflow:hidden}
.avatar.has{background:linear-gradient(135deg,#c8d6ea,#9fb4d0);color:#fff}
.icon-btn{border:1px solid var(--line-2);background:#fff;width:30px;height:30px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent)}
.icon-btn:hover{background:var(--accent-soft);border-color:#bcd0f7}
.pager{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);background:var(--surface-2);font-size:12.5px;color:var(--text-2);flex-wrap:wrap}
.pager .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pg{min-width:28px;height:28px;border:1px solid var(--line-2);background:#fff;border-radius:6px;cursor:pointer;font-size:12.5px}
.pg.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
.groupbar{padding:9px 14px;background:#fbfcfe;border-bottom:1px solid var(--line);font-size:12px;color:var(--text-3);font-style:italic}
.searchbar{padding:10px 14px;border-bottom:1px solid var(--line)}
.searchbar input{width:100%;max-width:420px;border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:8px 11px;font-size:13px}

/* ---------- pills / status ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:650;letter-spacing:.2px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.mute{background:#eef1f6;color:var(--text-2)}

/* ---------- employee summary card ---------- */
.emp-card{display:grid;grid-template-columns:1fr 150px;gap:18px}
.emp-kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.emp-kv .k{background:#eef3f8;padding:9px 12px;font-size:11.5px;font-weight:700;color:#33506d;letter-spacing:.2px}
.emp-kv .v{background:#fff;padding:9px 12px;font-size:13px}
.emp-photo{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-3);font-size:12px;padding:14px;text-align:center}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto;background:var(--surface);border-radius:var(--radius) var(--radius) 0 0}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 15px;cursor:pointer;color:var(--text-2);font-size:13px;font-weight:550;white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:650}

/* ---------- criteria ---------- */
.crit{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px}
.crit-radios{display:grid;grid-template-columns:repeat(4,1fr);gap:9px 16px;margin-bottom:14px}
.crit-radios label{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;color:var(--text)}
.or-sep{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--text-3);font-size:11px;font-weight:800;letter-spacing:1px}
.or-sep::after{content:'';flex:1;height:1px;background:var(--line)}

/* ---------- notes drawer ---------- */
.notes{position:fixed;top:0;right:0;bottom:0;width:400px;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(16,24,40,.12);z-index:60;transform:translateX(102%);transition:.22s ease;display:flex;flex-direction:column}
.notes.open{transform:none}
.notes-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.notes-h h4{margin:0;font-size:14px}
.notes-b{padding:16px 18px;overflow:auto;font-size:13px;line-height:1.55}
.note{border-left:3px solid var(--line-2);padding:2px 0 2px 11px;margin-bottom:13px;color:var(--text-2)}
.note.tbd{border-left-color:#c2410c}
.note.asm{border-left-color:#2f5fd0}
.note.conf{border-left-color:#c0392b}
.note b{color:var(--text);font-weight:650}
.note .tag{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:4px;margin-right:6px;font-weight:700}
.tag.tbd{background:var(--warn-soft);color:var(--warn)}
.tag.asm{background:var(--accent-soft);color:var(--accent)}
.tag.conf{background:var(--danger-soft);color:var(--danger)}
.backdrop{position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:55;display:none}
.backdrop.on{display:block}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:28px}
.modal.on{display:flex}
.modal-box{background:#fff;border-radius:var(--radius);box-shadow:0 20px 60px rgba(16,24,40,.28);width:min(1100px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--surface-2)}
.modal-h h3{margin:0;font-size:14.5px}
.modal-ctx{padding:9px 18px;background:var(--accent-soft);color:#20458f;font-size:12.5px;border-bottom:1px solid #dbe5fa;font-weight:600}
.modal-b{overflow:auto}

/* ---------- misc ---------- */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi .box{border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 15px;background:var(--surface-2)}
.kpi .box .lab{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-3);font-weight:700}
.kpi .box .val{font-size:26px;font-weight:700;margin-top:3px;letter-spacing:-.5px}
.callout{border:1px solid #ffd9b8;background:var(--warn-soft);color:#8a3a08;padding:11px 14px;border-radius:var(--radius-sm);font-size:12.5px;margin-bottom:14px}
.callout b{color:#6d2c05}
.file-drop{border:1.5px dashed var(--line-2);border-radius:var(--radius-sm);padding:18px;text-align:center;color:var(--text-3);font-size:12.5px;background:var(--surface-2)}
.chk-list{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 26px}
.chk-list label{display:flex;align-items:center;gap:9px;font-size:13px;padding:5px 7px;border-radius:6px;cursor:pointer}
.chk-list label:hover{background:var(--surface-2)}
.chk-list .ser{font-family:var(--mono);font-size:11px;color:var(--text-3);width:16px}
.rep-list{list-style:none;margin:0;padding:0}
.rep-list li{border-bottom:1px solid var(--line)}
.rep-list li:last-child{border-bottom:0}
.rep-list button{width:100%;text-align:left;background:none;border:0;padding:13px 16px;cursor:pointer;display:flex;align-items:center;gap:14px;font-size:13.5px;color:var(--text)}
.rep-list button:hover{background:var(--accent-soft);color:var(--accent)}
.rep-list .no{font-family:var(--mono);font-size:11.5px;color:var(--text-3);width:22px}
.rep-list .badge{margin-left:auto;font-size:11px;color:var(--text-3)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2233;color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;z-index:90;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--text-3);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
/* ---------- inline grid form (matches source layout) ---------- */
.ig{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:#fff}
.ig table.grid{border-collapse:collapse}
tr.igform td{background:#f2f7fb;border-bottom:1px solid var(--line);padding:16px 18px}
.ig-actions{display:flex;gap:16px;justify-content:flex-end;margin-top:14px;padding-top:11px;border-top:1px solid #dce7f0}
.ig-actions .linkbtn{font-weight:600}

/* ---------- wizard stepper ---------- */
.stepper{display:flex;gap:6px;overflow-x:auto;padding:4px 0 16px}
.step{display:flex;align-items:center;gap:9px;padding:9px 14px;border:1px solid var(--line);background:#fff;border-radius:var(--radius-sm);font-size:12.5px;color:var(--text-2);white-space:nowrap;cursor:pointer}
.step:hover{border-color:var(--line-2)}
.step .n{width:21px;height:21px;border-radius:50%;background:#eef1f6;color:var(--text-3);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex:none}
.step.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:650}
.step.on .n{background:var(--accent);color:#fff}
.step.done .n{background:var(--brand);color:#fff}
.step.done{color:var(--brand);border-color:#bfe0d3}
.wiz-nav{display:flex;gap:9px;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.wiz-nav .sp{margin-left:auto;color:var(--text-3);font-size:12.5px}

/* ---------- proposed / unverified banner ---------- */
.proposed{border:1px solid #d6c7f0;background:#f5efff;color:#4a2b7d;padding:11px 14px;border-radius:var(--radius-sm);font-size:12.5px;margin-bottom:16px}
.proposed b{color:#38215f}
.pill.prop{background:#f0e7ff;color:#5b3a94}

/* ---------- lifecycle action bar ---------- */
.lifebar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px}
.steps{display:flex;align-items:center;gap:0;margin-bottom:14px;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:8px;padding:6px 13px 6px 10px;border-radius:20px;font-size:12.5px;
  font-weight:600;color:var(--text-3);background:#f1f4f9;border:1px solid var(--line)}
.stp .n{width:19px;height:19px;border-radius:50%;background:#dfe4ed;color:#8a94a6;display:flex;
  align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
.stp.done{background:var(--brand-soft);color:var(--brand);border-color:#bfe0d3}
.stp.done .n{background:var(--brand);color:#fff}
.stp.now{background:var(--accent-soft);color:var(--accent);border-color:#c5d6fa;box-shadow:0 0 0 3px #eaf0fd}
.stp.now .n{background:var(--accent);color:#fff}
.stp-arrow{color:var(--line-2);margin:0 5px;font-size:13px}
.actbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:12px;border-top:1px solid var(--line)}
.actbar .spacer{margin-left:auto;font-size:12px;color:var(--text-3)}
.btn-lock{position:relative}
.btn[disabled]{cursor:not-allowed}
.mono-box{font-family:var(--mono);font-size:12px;background:#0f1520;color:#c8e6d8;padding:14px 16px;
  border-radius:8px;overflow-x:auto;white-space:pre;line-height:1.65}

/* ---------- chart ---------- */
.chart{overflow-x:auto;padding:8px 0}
.chart svg{display:block}
.bar{fill:var(--accent)}
.bar:hover{fill:#20458f}

@media(max-width:1100px){.shell{grid-template-columns:1fr}.side{position:static}.grid-form,.crit-radios{grid-template-columns:repeat(2,1fr)}.emp-card{grid-template-columns:1fr}.chk-list{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">SEMS <small>School Enterprise Management System</small></div>
    <nav class="topnav" id="topnav"></nav>
    <div class="topbar-right">
      <span class="clock" id="clock"></span>
      <a href="#" onclick="return false">EduHub</a>
      <a href="#" onclick="return false">Change Password</a>
      <a href="#" onclick="return false">Logout</a>
    </div>
  </div>
</div>
<div class="announce"><span>كل عام وانتم بخير بمناسبه قرب انتهاء الشهر الكريم وكل عام وانتم بخير بمناسبه عيد الفطر المبارك وللمزيد أضغط هنا</span></div>

<div class="shell">
  <aside class="side">
    <div class="panel">
      <div class="panel-h">Menu</div>
      <div class="panel-b">

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),2200);}
function sel(label,opts,attrs=''){return `<div class="f"><label>${label}</label><select ${attrs}>${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select></div>`;}
function txt(label,attrs='',hint=''){return `<div class="f"><label>${label}</label><input type="text" ${attrs}>${hint?`<span class="hint">${hint}</span>`:''}</div>`;}
function dt(label,attrs=''){return `<div class="f"><label>${label}</label><input type="date" ${attrs}></div>`;}
function req(){return '<span class="req" title="Required — marked with * in the source UI">*</span>';}
function pageHead(title,sub,code,actions=''){
  return `<div class="page-head">
    <div><h1 class="page-title">${title}</h1><p class="page-sub">${sub}</p></div>
    <div class="page-head-actions">${actions}
      <span class="code-badge">${code}</span>
      <button class="btn btn-sm btn-ghost" onclick="openNotes('${code}')">Spec notes</button>
    </div></div>`;
}
function pager(txtLeft,pages,size){
  return `<div class="pager"><span>${txtLeft}</span>
    ${pages?`<button class="pg on">1</button><button class="pg">2</button><button class="pg">›</button><button class="pg">All</button>`:''}
    <span class="right">Page size <select style="border:1px solid var(--line-2);border-radius:6px;padding:4px 7px"><option>${size}</option></select></span></div>`;
}
function critRadios(list,current,handler){
  return `<div class="crit-radios">${list.map(c=>`<label><input type="radio" name="crit" ${c===current?'checked':''} onchange="${handler}('${c.replace(/'/g,"\\'")}')"> ${esc(c)}</label>`).join('')}</div>`;
}
function openNotes(code){
  const n=NOTES[code]||[['tbd','—','No open questions recorded for this page.']];
  $('notesTitle').textContent='Spec notes — '+code;
  $('notesBody').innerHTML=n.map(([k,tag,body])=>`<div class="note ${k}"><span class="tag ${k}">${tag}</span>${body}</div>`).join('')
    +`<div style="margin-top:18px;font-size:12px;color:var(--text-3);border-top:1px solid var(--line);padding-top:12px">
      Notes are traceability links back to the Business System Documentation. Nothing on this screen invents behaviour that was not visible in the source system.</div>`;
  $('notes').classList.add('open');$('backdrop').classList.add('on');
}
function closeNotes(){$('notes').classList.remove('open');$('backdrop').classList.remove('on');}

/* Inline grid + inline form — reproduces the source layout exactly:
   the "New" / "Add X" trigger sits in the first header cell, the form opens
   INSIDE the grid box directly under the header row, and its actions are
   right-aligned text links (Save/Cancel on Education, Update/Cancel elsewhere). */
function inlineGrid(o){
  const span=o.cols.length+1;
  return `<div class="section-label">${o.title}</div>
   <div class="ig"><div class="tablewrap"><table class="grid">
     <thead><tr>
       <th style="width:140px"><button class="linkbtn" onclick="${o.toggle}">${o.addLabel}</button></th>
       ${o.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
     ${o.open?`<tbody><tr class="igform"><td colspan="${span}">
        ${o.form}
        <div class="ig-actions">
          <button class="linkbtn" onclick="${o.saveFn}">${o.saveLabel}</button>
          <button class="linkbtn" onclick="${o.toggle}">Cancel</button>
        </div></td></tr></tbody>`:''}
     <tbody>${o.rows.length?o.rows.map((r,i)=>`<tr><td>${i+1}</td>${o.rowMap(r)}</tr>`).join('')
       :(o.open?'':`<tr><td colspan="${span}" class="empty">No data to display</td></tr>`)}</tbody>
   </table></div></div>`;
}

  return inlineGrid({title:'Education Information',addLabel:'Add Education',open:S.showEdu,toggle:"S.showEdu=!S.showEdu;render()",
    cols:['Edu Level','University','Faculty','Grad Year','Grade','Major Studies','High School'],rows:S.edu,
    rowMap:r=>`<td>${esc(r.lvl)}</td><td>${esc(r.uni)}</td><td>${esc(r.fac)}</td><td>${esc(r.yr)}</td><td>${esc(r.grd)}</td><td>${esc(r.maj)}</td><td>${esc(r.hs)}</td>`,

/* ---------- generic renderer ---------- */
function goM(key,sub){S.sub=sub||'list';go(key);}
function pgModule(key){
  const m=MOD[key];

  const sub=(subs.some(s=>s[0]===S.sub)?S.sub:'list');
  let body='';
  if(m.reportList){
    body=`<div class="card"><div class="card-b tight"><ul class="rep-list">
      ${m.reportList.map((r,i)=>{const k='pr-'+String(i+1).padStart(2,'0');
        return `<li><button onclick="${PR[k]?`openPR('${k}')`:`toast('Not yet designed')`}">
        <span class="no">${i+1}</span><span>${esc(r)}</span>
        <span class="badge"><span class="pill prop">proposed</span></span></button></li>`;}).join('')}
    </ul></div></div>`;
  } else if(sub==='list') body=modList(m);
  else if(sub==='detail') body=modDetail(m);
  else body=modForm(m);
  return pageHead(m.name,m.purpose,m.code,
     `<span class="pill prop">Proposed</span><span class="pill mute">${m.scen}</span>`)
   +`<div class="proposed"><b>Proposed screen — not in the existing system.</b> Designed at your request from standard HR practice. Organisational filters and employee identity fields reuse the confirmed dimensions of the documented system. Figures shown are illustrative (EGP).</div>`
   +(m.reportList?'':`<div class="tabs" style="margin-bottom:16px;border:1px solid var(--line);border-radius:var(--radius)">
       ${subs.map(([k,l])=>`<button class="${sub===k?'on':''}" onclick="goM('${key}','${k}')">${l}</button>`).join('')}</div>`)
   +body;
}
function modList(m){

      /Date|Month/.test(c)?(/Month/.test(c)?sel(c,['2025-2026','Mar 2026','Feb 2026','Jan 2026']):dt(c))
      :(/Code \/ Name|Applicant Name/.test(c)?txt(c):sel(c,critValues(c)))).join('')}</div>
      <div style="margin-top:16px"><button class="btn btn-accent" onclick="toast('Search — proposed behaviour')">Search</button></div>
    </div></div>
   <div class="card"><div class="card-h"><h3>Results</h3><div class="right">
      <button class="btn btn-sm btn-primary" onclick="goM('${m.key}','${m.form?'form':'list'}')">+ New</button>
      <button class="btn btn-sm" onclick="toast('Export — proposed')">Export ▾</button></div></div>
    <div class="card-b tight">
      <div class="groupbar">Drag a column header here to group by that column</div>
      <div class="tablewrap"><table class="grid">
        <thead><tr>${m.cols.map(c=>`<th>${esc(c[0])}</th>`).join('')}</tr>
        <tr class="filters">${m.cols.map(c=>`<td>${/Status|Type|Department|Work Place|Shift/.test(c[0])?'<select><option></option></select>':'<input>'}</td>`).join('')}</tr></thead>
        <tbody>${m.rows.map(r=>`<tr>${r.map((v,i)=>{
          const h=m.cols[i][0], t=m.cols[i][1];
          if(h==='Details') return `<td><button class="icon-btn" onclick="goM('${m.key}','detail')">▤</button></td>`;
          if(t==='Status') return `<td><span class="pill ${/Active|Approved|Applied|Posted|Completed|Present|Passed/.test(v)?'ok':/Pending|Draft|Screening|In Progress|Calculated|Scheduled|Offer/.test(v)?'warn':/Absent|Rejected|Late|Missing|Not registered|Closed|Early Leave/.test(v)?'bad':'mute'}">${esc(v)}</span></td>`;
          if(t==='Currency') return `<td style="text-align:right;font-variant-numeric:tabular-nums">${esc(v)}</td>`;
          return `<td>${esc(v)}</td>`;}).join('')}</tr>`).join('')}</tbody>
      </table></div>
      ${pager(m.rows.length+' sample rows — illustrative data',false,30)}
    </div></div>
   ${m.actions?`<div class="card"><div class="card-b"><b style="font-size:12.5px">Page actions</b>
     <div style="margin-top:8px;color:var(--text-2);font-size:13px">${esc(m.actions)}</div></div></div>`:''}`;
}
/* ---------- status lifecycle engine ----------
   Turns the documented action list into real, status-driven buttons:
   an action is only enabled when the record is in one of its "from" states. */
let _confirmFn=null;
function lcState(key){const m=MOD[key];return S.lc[key]||m.lifecycle.states[0];}
function lcIsFirst(key){return lcState(key)===MOD[key].lifecycle.states[0];}
function lcDo(key,i){
  const a=MOD[key].lifecycle.actions[i];
  if(a.confirm){confirmBox(a.l,a.confirm,()=>lcApply(key,i));return;}
  lcApply(key,i);
}
function lcApply(key,i){
  const m=MOD[key],a=m.lifecycle.actions[i],sts=m.lifecycle.states,st=lcState(key);
  if(a.act==='bank'){bankFile();return;}
  if(a.act==='register'){registerPreview();return;}
  if(a.act==='toast'){toast(a.l+' — proposed behaviour');return;}
  if(a.to==='prev'){const j=Math.max(0,sts.indexOf(st)-1);S.lc[key]=sts[j];toast('Rolled back to '+sts[j]);}
  else{S.lc[key]=a.to;toast(a.t||('Status: '+a.to));}
  render();
}
function confirmBox(title,text,fn){
  _confirmFn=fn;
  showModal(title,'',`<div style="padding:22px 24px">
    <p style="margin:0 0 20px;font-size:14px;line-height:1.6">${esc(text)}</p>
    <div style="display:flex;gap:9px;justify-content:flex-end">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-warn" onclick="runConfirm()">${esc(title)}</button></div></div>`);
}
function runConfirm(){closeModal();const f=_confirmFn;_confirmFn=null;if(f)f();}

function dl(name,text){
  const b=new Blob([text],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);
  toast('Downloaded '+name);
}
function lifebar(key){
  const m=MOD[key],lc=m.lifecycle,st=lcState(key),idx=lc.states.indexOf(st);
  return `<div class="lifebar">
    <div class="steps">${lc.states.map((s,i)=>
      `${i?'<span class="stp-arrow">→</span>':''}<span class="stp ${i<idx?'done':i===idx?'now':''}">
        <span class="n">${i<idx?'✓':i+1}</span>${esc(s)}</span>`).join('')}</div>
    <div class="actbar">
      ${lc.actions.map((a,i)=>{
        const on=a.from.includes(st);
        const cls=a.style==='primary'?'btn-primary':a.style==='warn'?'btn-warn':a.style==='accent'?'btn-accent':a.style==='ghost'?'btn-ghost':'';
        return `<button class="btn btn-sm ${cls}" ${on?'':'disabled'} onclick="lcDo('${key}',${i})"
          title="${on?'':'Available when status is: '+a.from.join(' / ')}">${esc(a.l)}</button>`;}).join('')}
      <span class="spacer">Current status: <b style="color:var(--text-2)">${esc(st)}</b></span>
    </div></div>`;
}

function modDetail(m){
  const d=m.detail, lc=m.lifecycle, st=lc?lcState(m.key):null, first=lc?lcIsFirst(m.key):false;
  const card=d.card.map(([k,v])=>{
    if(lc&&/^Status$/i.test(k))
      return `<div class="k">${esc(k)}</div><div class="v"><span class="pill ${st===lc.states[lc.states.length-1]?'ok':st===lc.states[0]?'mute':'warn'}">${esc(st)}</span></div>`;
    if(lc&&first&&/^(Employees|Total )/i.test(k))
      return `<div class="k">${esc(k)}</div><div class="v" style="color:var(--text-3)">— not calculated</div>`;
    return `<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div>`;}).join('');
  return (lc?lifebar(m.key):'')
   +`<div class="card"><div class="card-h"><h3>Record Information</h3></div><div class="card-b">
     <div class="emp-kv">${card}</div>
   </div></div>
   ${(d.grids||[]).map((g,gi)=>`<div class="card"><div class="card-h"><h3>${esc(g[0])}</h3>
      <div class="right">${lc&&gi===0?'':`<button class="btn btn-sm" onclick="goM('${m.key}','${m.form?'form':'detail'}')">+ Add row</button>`}</div></div>
     <div class="card-b tight"><div class="tablewrap"><table class="grid">
       <thead><tr>${g[1].map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
       <tbody>${(lc&&first&&gi===0)
         ?`<tr><td colspan="${g[1].length}" class="empty">No lines yet — press <b>${esc(lc.actions[0].l)}</b> above to build them.</td></tr>`
         :g[2].map(r=>`<tr>${r.map((v,ci)=>{
             if(lc&&gi===0&&ci===r.length-1&&/Calculated|Approved/.test(v))
               return `<td><span class="pill ${st==='Posted'?'ok':'warn'}">${esc(st==='Draft'?'—':st)}</span></td>`;
             return `<td>${esc(v)}</td>`;}).join('')}</tr>`).join('')}</tbody>
     </table></div></div></div>`).join('')}
   ${lc?'':`<div class="card"><div class="card-b"><b style="font-size:12.5px">Record actions</b>
     <div style="margin-top:8px;color:var(--text-2);font-size:13px">${esc(m.actions||'TBD')}</div></div></div>`}`;
}
function modForm(m){
  const f=m.form;
  return `<div class="card"><div class="card-h"><h3>${esc(f.title)}</h3>
      <div class="right"><span class="pill mute">${f.fields.length} fields</span></div></div>
    <div class="card-b">
      <div class="grid-form c3">${f.fields.map(([l,t,r,n])=>{
        const lab=esc(l)+(r==='Yes'?' <span class="req">*</span>':r==='Auto'?' <span class="derived">auto</span>':'');
        let ctl;
        if(t==='Dropdown'||t==='Multi-select'||t==='Lookup') ctl=`<select><option></option><option>${esc(n||'—')}</option></select>`;
        else if(t==='Date') ctl='<input type="date">';
        else if(t==='Time') ctl='<input type="time">';
        else if(t==='Number'||t==='Currency') ctl='<input type="number">';
        else if(t==='Textarea') ctl='<textarea rows="2"></textarea>';
        else if(t==='File') ctl='<input type="file">';
        else if(t==='Checkbox') ctl='<div class="radio-row"><label><input type="checkbox"> Yes</label></div>';
        else if(t==='Radio') ctl=`<div class="radio-row">${(n||'A / B').split('·')[0].split('/').map(o=>`<label><input type="radio" name="${esc(l)}"> ${esc(o.trim())}</label>`).join('')}</div>`;
        else if(t==='Grid') ctl='<input value="Inline grid — see Detail tab" disabled>';
        else ctl='<input type="text"'+(r==='Auto'?' disabled':'')+'>';
        return `<div class="f"><label>${lab}</label>${ctl}${n&&t!=='Dropdown'&&t!=='Lookup'&&t!=='Radio'?`<span class="hint">${esc(n)}</span>`:''}</div>`;}).join('')}
      </div>
      <div class="wiz-nav">
        <button class="btn btn-primary" onclick="toast('Saved — proposed behaviour; message text not defined')">Save</button>
        <button class="btn" onclick="goM('${m.key}','list')">Cancel</button>
        <span class="sp">Required markers follow standard HR practice, not the source system</span>
      </div>
    </div></div>`;
}
